services:
  postgres:
    image: postgres:18-alpine
    container_name: siaga_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - siaga_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    # Intentionally NOT exposing 5432 to the host. The API reaches it over the
    # compose network. For external psql use an SSH tunnel, or bind localhost:
    # ports: ["127.0.0.1:5432:5432"]

  siaga-api:
    image: ghcr.io/irvanmhndra/siaga-api:${IMAGE_TAG:-latest}
    container_name: siaga_api
    env_file: .env
    ports:
      - "127.0.0.1:8089:8089"   # only nginx needs this; do not expose publicly
    volumes:
      - ./web-dist:/app/web:ro  # SPA dist from siaga-web (scp'd by CI)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  siaga_pgdata:
