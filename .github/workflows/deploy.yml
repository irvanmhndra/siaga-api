name: Deploy siaga-api
on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          args: --timeout=5m
      - run: go test -race -timeout 120s ./...

  deploy:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Login GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & push (SHA + latest)
        run: |
          IMG=ghcr.io/irvanmhndra/siaga-api
          docker build -t $IMG:${{ github.sha }} -t $IMG:latest .
          docker push $IMG:${{ github.sha }}
          docker push $IMG:latest

      - name: Deploy (pin SHA)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/siaga
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull siaga-api
            docker compose up -d siaga-api
            docker image prune -f
            sleep 5
            wget -qO- http://127.0.0.1:8089/health && echo " deployed ${{ github.sha }}"
